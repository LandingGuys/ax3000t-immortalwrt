name: Build ImmortalWrt AX3000T (ZRAM ZSTD)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "config/**"

permissions:
  contents: read

concurrency:
  group: ax3000t-immortalwrt-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      IMMORTALWRT_REF: v25.12.2
      BUILD_JOBS: 4

    steps:
      - name: Inspect and free runner resources
        shell: bash
        run: |
          echo "===== RUNNER ====="
          date -u
          nproc
          lscpu
          free -h
          echo "===== DISK BEFORE CLEANUP ====="
          df -hT
          df -i

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo docker system prune -af || true

          echo "===== DISK AFTER CLEANUP ====="
          df -hT
          df -i

      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "===== DISK AFTER DEPENDENCIES ====="
          df -hT
          df -i

      - name: Clone ImmortalWrt source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            --branch "${IMMORTALWRT_REF}" \
            https://github.com/immortalwrt/immortalwrt.git immortalwrt
          cd immortalwrt
          echo "Source commit: $(git rev-parse HEAD)"
          git log -1 --oneline
          echo "===== DISK AFTER SOURCE ====="
          df -hT
          df -i

      - name: Cache package downloads
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: ${{ runner.os }}-immortalwrt-${{ env.IMMORTALWRT_REF }}-${{ hashFiles('config/**') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-${{ env.IMMORTALWRT_REF }}-

      - name: Update and install feeds
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "===== FEED REVISIONS ====="
          for feed in feeds/*; do
            if [ -d "$feed" ] && { [ -e "$feed/.git" ] || [ -f "$feed/.git" ]; }; then
              printf '%s ' "$feed"
              git -C "$feed" rev-parse HEAD
            fi
          done | tee ../feeds-revisions.txt

          echo "===== DISK AFTER FEEDS ====="
          df -hT
          df -i

      - name: Configure AX3000T and ZRAM ZSTD
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail
          date -u +'%Y-%m-%dT%H:%M:%SZ' > ../build-start-utc.txt

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_kmod-zram=y
          CONFIG_PACKAGE_zram-swap=y

          # OpenClash kernel modules; install OpenClash LuCI package separately.
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          EOF

          # OpenWrt top-level kernel options, not raw Linux Kconfig entries.
          cat ../config/zram.config >> .config
          make defconfig

          echo "===== TARGET CONFIG ====="
          grep '^CONFIG_TARGET_mediatek_filogic_DEVICE_' .config
          echo "===== ZRAM CONFIG ====="
          grep -E '^CONFIG_(PACKAGE_(kmod-zram|zram-swap)|KERNEL_ZRAM_)' .config

          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-zram=y$' .config
          grep -q '^CONFIG_PACKAGE_zram-swap=y$' .config
          grep -q '^CONFIG_KERNEL_ZRAM_BACKEND_LZO=y$' .config
          grep -q '^CONFIG_KERNEL_ZRAM_BACKEND_ZSTD=y$' .config
          grep -q '^CONFIG_KERNEL_ZRAM_DEF_COMP_ZSTD=y$' .config

          if grep -q '^CONFIG_PACKAGE_luci-app-openclash=y$' .config; then
            echo "ERROR: OpenClash must not be included in this minimal build"
            exit 1
          fi

      - name: Download package sources
        working-directory: immortalwrt
        shell: bash
        run: |
          set -o pipefail
          echo "Build jobs: ${BUILD_JOBS}"
          echo "===== DISK BEFORE DOWNLOAD ====="
          df -hT
          df -i

          if ! make download -j"${BUILD_JOBS}" 2>&1 | tee ../download.log; then
            echo "Parallel download failed; retrying single-threaded with verbose output..."
            make download -j1 V=s 2>&1 | tee -a ../download.log
          fi

          echo "===== DISK AFTER DOWNLOAD ====="
          df -hT
          df -i

      - name: Build firmware
        working-directory: immortalwrt
        shell: bash
        run: |
          set -o pipefail
          echo "Build jobs: ${BUILD_JOBS}"
          echo "===== RESOURCES BEFORE BUILD ====="
          nproc
          free -h
          df -hT
          df -i

          if ! make -j"${BUILD_JOBS}" 2>&1 | tee ../build.log; then
            echo "Parallel build failed; retrying single-threaded with verbose output..."
            make -j1 V=s 2>&1 | tee -a ../build.log
          fi

          echo "===== RESOURCES AFTER BUILD ====="
          free -h
          df -hT
          df -i

      - name: Verify kernel configuration and image profile
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking generated kernel config..."

          mapfile -t KERNEL_CONFIGS < <(
            find build_dir -type f \
              -path '*/linux-mediatek_filogic/linux-*/.config' -print
          )

          if [ "${#KERNEL_CONFIGS[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one Filogic kernel .config, found ${#KERNEL_CONFIGS[@]}"
            printf '%s\n' "${KERNEL_CONFIGS[@]}"
            exit 1
          fi

          KCFG="${KERNEL_CONFIGS[0]}"
          grep -q '^CONFIG_ZRAM=m$' "$KCFG" || {
            echo "ERROR: CONFIG_ZRAM is not built as a module"
            exit 1
          }
          grep -q '^CONFIG_ZRAM_BACKEND_LZO=y$' "$KCFG" || {
            echo "ERROR: CONFIG_ZRAM_BACKEND_LZO is not enabled"
            exit 1
          }
          grep -q '^CONFIG_ZRAM_BACKEND_ZSTD=y$' "$KCFG" || {
            echo "ERROR: CONFIG_ZRAM_BACKEND_ZSTD is not enabled"
            exit 1
          }
          grep -q '^CONFIG_ZRAM_DEF_COMP_ZSTD=y$' "$KCFG" || {
            echo "ERROR: ZSTD is not the default ZRAM compressor"
            exit 1
          }

          echo "Verified kernel config: $KCFG"
          grep -E '^CONFIG_ZRAM(=|_)' "$KCFG"

          IMAGE_DIR="bin/targets/mediatek/filogic"
          mkdir -p "$IMAGE_DIR"
          find "$IMAGE_DIR" -maxdepth 1 -type f \
            -name '*xiaomi_mi-router-ax3000t*' -print

          IMAGE="$(find "$IMAGE_DIR" -maxdepth 1 -type f \
            -name '*xiaomi_mi-router-ax3000t*squashfs-sysupgrade.bin' \
            -print -quit)"

          if [ -z "$IMAGE" ]; then
            echo "ERROR: ordinary AX3000T sysupgrade image not found"
            exit 1
          fi

          echo "Selected image: $IMAGE"
          sha256sum "$IMAGE" | tee "$IMAGE.sha256"
          cp "$KCFG" "$IMAGE_DIR/ax3000t-kernel.config"
          cp .config "$IMAGE_DIR/ax3000t-build.config"

          SOURCE_COMMIT="$(git rev-parse HEAD)"
          IMAGE_SIZE="$(stat -c '%s' "$IMAGE")"
          IMAGE_SHA256="$(sha256sum "$IMAGE" | awk '{print $1}')"
          BUILD_STARTED="$(cat ../build-start-utc.txt)"
          BUILD_FINISHED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          {
            echo "Device: Xiaomi Mi Router AX3000T"
            echo "Target: mediatek/filogic"
            echo "ImmortalWrt ref: ${IMMORTALWRT_REF}"
            echo "Source commit: ${SOURCE_COMMIT}"
            echo "Build started (UTC): ${BUILD_STARTED}"
            echo "Build finished (UTC): ${BUILD_FINISHED}"
            echo "Build jobs: ${BUILD_JOBS}"
            echo "ZRAM: module"
            echo "ZRAM backends: LZO, ZSTD"
            echo "ZRAM default compressor: ZSTD"
            echo "OpenClash: disabled"
            echo "Image: $(basename "$IMAGE")"
            echo "Image size (bytes): ${IMAGE_SIZE}"
            echo "Image SHA256: ${IMAGE_SHA256}"
          } > "$IMAGE_DIR/ax3000t-build-info.txt"

          cp ../feeds-revisions.txt "$IMAGE_DIR/ax3000t-feeds-revisions.txt"
          echo "===== BUILD INFO ====="
          cat "$IMAGE_DIR/ax3000t-build-info.txt"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ax3000t-zram-zstd-${{ github.run_number }}
          path: |
            immortalwrt/bin/targets/mediatek/filogic/*xiaomi_mi-router-ax3000t*
            immortalwrt/bin/targets/mediatek/filogic/ax3000t-kernel.config
            immortalwrt/bin/targets/mediatek/filogic/ax3000t-build.config
            immortalwrt/bin/targets/mediatek/filogic/ax3000t-build-info.txt
            immortalwrt/bin/targets/mediatek/filogic/ax3000t-feeds-revisions.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ax3000t-diagnostics-${{ github.run_number }}
          path: |
            download.log
            build.log
            feeds-revisions.txt
            build-start-utc.txt
            immortalwrt/.config
            immortalwrt/build_dir/**/linux-mediatek_filogic/linux-*/.config
          if-no-files-found: warn
          retention-days: 7
